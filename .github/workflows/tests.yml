name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install mutagen "segno==1.6.6" "shazamio==0.9.0" "yt-dlp[default]" py-opensonic
      - name: Check every file compiles
        run: python -m compileall -q app
      - name: API tests
        run: bash test/run_api_tests.sh
